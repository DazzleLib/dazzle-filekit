# Read the Docs build configuration for dazzle-filekit.
# Reference: https://docs.readthedocs.com/platform/stable/config-file/v2.html
#
# The build installs the package itself (not just the doc tooling) because
# autodoc reads the real docstrings and conf.py reads the real __version__.
# A docs build therefore also acts as a smoke test that the package imports
# cleanly on Linux with no Windows extras present.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      # Full history so the "last updated" footer is real rather than the
      # shallow-clone default of a single commit.
      - git fetch --unshallow || true

sphinx:
  configuration: docs/conf.py
  # Warnings fail the build. A dead cross-reference is a bug in the docs,
  # and catching it here is far cheaper than a reader finding it.
  fail_on_warning: true

formats:
  - pdf
  - epub

python:
  install:
    - requirements: docs/requirements.txt
    # Install filekit itself so autodoc has something to import.
    - method: pip
      path: .
