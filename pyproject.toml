[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dazzle-filekit"
version = "0.4.0"
description = "Cross-platform file operations toolkit with path handling, verification, and metadata preservation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dynamic = []
authors = [
    {name = "Dustin Darcy", email = "6962246+djdarcy@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Filesystems",
]
keywords = ["file", "operations", "path", "verification", "hash", "metadata", "cross-platform"]
dependencies = [
    "pathlib;python_version<\"3.4\"",
    # The stack bedrock: shared Protocols (incl. PathVariantResolver),
    # payload TypedDicts, and the DazzleError/FileOperationError roots.
    "dazzle-lib>=0.2.0",
    # unctools is the L0 path-identity layer; filekit's default
    # PathVariantResolver is backed by it (UNC<->mapped-drive fallback for
    # copy/move/open). A hard dep: filekit already requires pywin32 on
    # Windows, and unctools' base is pure-Python (pywin32 is its own
    # [windows] extra), so the cost is small and it removes optional-load
    # awkwardness. See the 2026-06-14 resolver-edge DWP. >=0.2.2 carries the
    # WNetGetUniversalName drive-map enrichment that absorbed filekit's removed
    # get_drive_mappings (stack V9).
    "unctools>=0.2.2",
    # pywin32 powers the rich Windows metadata features in
    # dazzle_filekit.metadata (SDDL ACL round-trip, ctime restoration,
    # junction detection via DeviceIoControl, NTFS ADS enumeration).
    # The module falls back to attrib-command behavior if pywin32 is
    # missing, but the full feature set requires it. Pinned to >=305
    # (first stable release after the build317 rename).
    "pywin32>=305; sys_platform == \"win32\"",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "flake8>=3.8.0",
    "black>=20.8b1",
]

[project.urls]
"Homepage" = "https://github.com/DazzleLib/dazzle-filekit"
"Bug Reports" = "https://github.com/DazzleLib/dazzle-filekit/issues"
"Source" = "https://github.com/DazzleLib/dazzle-filekit"
"Documentation" = "https://github.com/DazzleLib/dazzle-filekit#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["dazzle_filekit*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
dazzle_filekit = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312", "py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=dazzle_filekit --cov-report=term-missing"
norecursedirs = ["_drafts", "__pycache__"]
