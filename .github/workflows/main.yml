name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests with pytest
      run: |
        pytest tests/ -v --cov=dazzle_filekit --cov-report=term-missing

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 dazzle_filekit --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 dazzle_filekit --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: 3.11

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package with twine
      run: |
        twine check dist/*

  docs:
    runs-on: ubuntu-latest
    needs: test

    # Read the Docs builds the published site on its own infrastructure, on
    # push, after merge. That is too late to protect a pull request: a dead
    # cross-reference or an unparseable docstring would land on main and only
    # surface as a red RTD build afterwards. This job runs the same build with
    # the same warnings-as-errors setting, so docs breakage fails PR checks
    # alongside the tests.
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install docs dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements.txt
        # autodoc imports the package to read its real docstrings, so the
        # package itself has to be installed -- this doubles as a check that
        # filekit imports cleanly on Linux with no Windows extras present.
        pip install .

    - name: Build docs (warnings are errors)
      run: |
        python -m sphinx -b html docs docs/_build/html -W --keep-going

    - name: Check for broken external links
      # Informational only: a third-party site being down should not fail the
      # build, but a permanently dead link should be visible in the log.
      continue-on-error: true
      run: |
        python -m sphinx -b linkcheck docs docs/_build/linkcheck

    - name: Upload built docs
      uses: actions/upload-artifact@v4
      with:
        name: docs-html
        path: docs/_build/html/
        retention-days: 14
